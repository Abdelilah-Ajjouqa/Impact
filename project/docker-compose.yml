services:
  app:
    image: php:8.2-cli
    container_name: impact_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: unless-stopped
    depends_on:
      - mysql
    env_file:
      - .env

  mysql:
    image: mysql:8.0
    container_name: impact_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: impact
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - impact_mysql_data:/var/lib/mysql

volumes:
  impact_mysql_data:
    driver: local
