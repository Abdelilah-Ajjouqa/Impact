services:
  app:
    image: php:8.2-cli
    container_name: impact_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_DATABASE: impact
      DB_USERNAME: root
      DB_PASSWORD: password

  mysql:
    image: mysql:8.0
    container_name: impact_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: impact
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - impact_mysql_data:/var/lib/mysql

volumes:
  impact_mysql_data:
    driver: local
